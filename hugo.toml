baseURL = 'https://hf-000.github.io/'
languageCode = 'en-us'
title = 'Itachi的博客'

[module]
  [[module.imports]]
    path = "github.com/hugo-sid/hugo-blog-awesome"

[params]
  # 作者信息配置
  [params.author]
    avatar = "images/test.png"
    intro = "你的名字"
    description = "这是我的博客简介"
  
  # Giscus 评论配置
  [params.giscus]
    enable = true
    repo = "hf-000/hf-000.github.io"
    repoId = "R_kgDOQ2mDKQ"
    category = "Announcements"
    categoryId = "DIC_kwDOQ2mDKc4C00Bc"
    mapping = "pathname"
    strict = false
    reactionsEnabled = true
    emitMetadata = false
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "zh-CN"

[menu]

  [[menu.main]]
    name = "主页"
    url = "/"
    weight = 1

  [[menu.main]]
    name = "关于我"
    url = "/about/"
    weight = 2

  [[menu.main]]
    name = "分类"
    url = "/categories/"
    weight = 3
  
  [[menu.main]]
    name = "snow"
    url = "/snow/"
    weight = 4