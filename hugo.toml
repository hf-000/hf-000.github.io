baseURL = 'https://hf-000.github.io/'
languageCode = 'zh-cn'
title = "Snochi'blog"

[module]
  [[module.imports]]
    path = "github.com/hugo-sid/hugo-blog-awesome"

[params]
  # 作者信息配置
  [params.author]
    avatar = "images/test.png"
    intro = "Snochi"
    description = "嘿嘿，喜欢一个人哦"
  
  # Giscus 评论配置
  [params.giscus]
    enable = true
    repo = "hf-000/hf-000.github.io"
    repoId = "R_kgDOQ2mDKQ"
    category = "Announcements"
    categoryId = "DIC_kwDOQ2mDKc4C00Bc"
    mapping = "pathname"
    strict = false
    reactionsEnabled = true
    emitMetadata = false
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "zh-CN"

[menu]



  [[menu.main]]
    name = "about"
    url = "/about/"
    weight = 1

  [[menu.main]]
    name = "categories"
    url = "/categories/"
    weight = 2
  
  [[menu.main]]
    name = "snow"
    url = "/snow/"
    weight = 3